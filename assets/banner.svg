<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Islam Amr — AI Engineer, LLM Security, Motion Graphics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff4f9a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#ff4f9a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .node { fill: #36bcf7; }
    .node.p { fill: #ff4f9a; }
    .node.v { fill: #a78bfa; }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
    .edge { stroke: #36bcf7; stroke-opacity: .28; stroke-width: 1.2; fill: none; }
    .flow { stroke: #a78bfa; stroke-width: 2; fill: none; stroke-dasharray: 6 220; animation: flow 3.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -226; } }
    .title { font: 800 64px 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif; letter-spacing: -1px; }
    .sub { font: 500 22px 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif; fill: #c9d4ff; }
    .mono { font: 600 15px 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #7dd3fc; letter-spacing: 1px; }
    .rot { font: 700 26px 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif; opacity: 0; animation: rot 12s infinite; }
    .r1 { animation-delay: 0s; fill: #36bcf7; }
    .r2 { animation-delay: 3s; fill: #a78bfa; }
    .r3 { animation-delay: 6s; fill: #ff4f9a; }
    .r4 { animation-delay: 9s; fill: #34d399; }
    @keyframes rot { 0% { opacity: 0; transform: translateY(14px); } 4%,21% { opacity: 1; transform: translateY(0); } 25%,100% { opacity: 0; transform: translateY(-14px); } }
    .bar { fill: url(#wave); transform-box: fill-box; transform-origin: bottom; animation: eq 1.2s ease-in-out infinite; }
    @keyframes eq { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
    .cursor { fill: #36bcf7; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .intro { animation: intro 1.2s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes intro { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
    .ring { fill: none; stroke: #36bcf7; stroke-opacity: .5; transform-box: fill-box; transform-origin: center; animation: ring 4s ease-out infinite; }
    @keyframes ring { from { transform: scale(.4); opacity: .8; } to { transform: scale(2.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rot.r1 { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="930" cy="160" r="230" fill="url(#glow)"/>

    <!-- neural network (right side) -->
    <g transform="translate(760 40)">
      <g class="edge">
        <path d="M20 40L160 20M20 40L160 120M20 40L160 220M20 140L160 20M20 140L160 120M20 140L160 220M20 240L160 120M20 240L160 220"/>
        <path d="M160 20L300 70M160 20L300 170M160 120L300 70M160 120L300 170M160 220L300 70M160 220L300 170"/>
        <path d="M300 70L400 120M300 170L400 120"/>
      </g>
      <path class="flow" d="M20 40L160 120L300 70L400 120"/>
      <path class="flow" style="animation-delay:-1.1s;stroke:#36bcf7" d="M20 240L160 220L300 170L400 120"/>
      <path class="flow" style="animation-delay:-2.2s;stroke:#ff4f9a" d="M20 140L160 20L300 70L400 120"/>
      <circle class="node pulse" cx="20" cy="40" r="6"/>
      <circle class="node pulse" style="animation-delay:.4s" cx="20" cy="140" r="6"/>
      <circle class="node pulse" style="animation-delay:.8s" cx="20" cy="240" r="6"/>
      <circle class="node v pulse" style="animation-delay:1.2s" cx="160" cy="20" r="7"/>
      <circle class="node v pulse" style="animation-delay:1.6s" cx="160" cy="120" r="7"/>
      <circle class="node v pulse" style="animation-delay:2s" cx="160" cy="220" r="7"/>
      <circle class="node p pulse" style="animation-delay:2.4s" cx="300" cy="70" r="7"/>
      <circle class="node p pulse" style="animation-delay:2.8s" cx="300" cy="170" r="7"/>
      <circle class="ring" cx="400" cy="120" r="14"/>
      <circle class="ring" style="animation-delay:2s" cx="400" cy="120" r="14"/>
      <circle cx="400" cy="120" r="12" fill="#ffffff"/>
      <text x="400" y="126" text-anchor="middle" font-size="15">🦉</text>
    </g>

    <!-- text block (left side) -->
    <g>
      <text x="64" y="70" class="mono">&gt; whoami<tspan class="cursor">▍</tspan></text>
      <text x="60" y="140" class="title" fill="url(#name)">Islam Amr</text>
      <text x="64" y="178" class="sub">AI Engineer · Local LLMs &amp; Agents · LLM Security</text>
      <g transform="translate(64 222)">
        <text class="rot r1">🤖 Building local Arabic AI</text>
        <text class="rot r2">🎙️ Voice AI: Whisper + TTS</text>
        <text class="rot r3">🔐 Guarding LLMs from prompt injection</text>
        <text class="rot r4">🎬 AI-powered motion graphics</text>
      </g>
    </g>

    <!-- voice equalizer (bottom left) -->
    <g transform="translate(64 252)">
      <rect class="bar" x="0"   y="0" width="6" height="40" rx="3" style="animation-delay:-.1s"/>
      <rect class="bar" x="12"  y="0" width="6" height="40" rx="3" style="animation-delay:-.5s"/>
      <rect class="bar" x="24"  y="0" width="6" height="40" rx="3" style="animation-delay:-.9s"/>
      <rect class="bar" x="36"  y="0" width="6" height="40" rx="3" style="animation-delay:-.3s"/>
      <rect class="bar" x="48"  y="0" width="6" height="40" rx="3" style="animation-delay:-.7s"/>
      <rect class="bar" x="60"  y="0" width="6" height="40" rx="3" style="animation-delay:-1.1s"/>
      <rect class="bar" x="72"  y="0" width="6" height="40" rx="3" style="animation-delay:-.2s"/>
      <rect class="bar" x="84"  y="0" width="6" height="40" rx="3" style="animation-delay:-.6s"/>
      <rect class="bar" x="96"  y="0" width="6" height="40" rx="3" style="animation-delay:-1s"/>
      <rect class="bar" x="108" y="0" width="6" height="40" rx="3" style="animation-delay:-.4s"/>
      <rect class="bar" x="120" y="0" width="6" height="40" rx="3" style="animation-delay:-.8s"/>
      <rect class="bar" x="132" y="0" width="6" height="40" rx="3" style="animation-delay:-.15s"/>
    </g>
    <text x="220" y="285" class="mono" style="fill:#94a3b8;font-size:13px">SAHIR · ساهر — local Arabic voice assistant</text>
  </g>
</svg>
