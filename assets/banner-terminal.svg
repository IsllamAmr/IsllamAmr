<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Islam Amr — AI Engineer terminal">
  <style>
    .mono { font: 500 19px 'Cascadia Code', 'Fira Code', Consolas, monospace; }
    .p { fill: #34d399; } .c { fill: #e6edf3; } .o { fill: #8b949e; } .k { fill: #36bcf7; } .m { fill: #ff79c6; } .y { fill: #f1fa8c; }
    .l { opacity: 0; animation: show 12s infinite; }
    @keyframes show { 0% { opacity: 0; } 3%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .type { animation: type 12s steps(30) infinite; }
    @keyframes type { 0% { width: 0; } 10%, 92% { width: 420px; } 96%, 100% { width: 0; } }
    .cur { fill: #e6edf3; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .l { opacity: 1; } }
  </style>
  <defs><clipPath id="t"><rect class="type" x="68" y="72" height="30" width="420"/></clipPath></defs>
  <rect width="1200" height="300" rx="18" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#30363d"/>
  <rect x="1" y="1" width="1198" height="40" rx="17" fill="#161b22"/>
  <rect x="1" y="24" width="1198" height="17" fill="#161b22"/>
  <circle cx="30" cy="21" r="7" fill="#ff5f56"/><circle cx="54" cy="21" r="7" fill="#ffbd2e"/><circle cx="78" cy="21" r="7" fill="#27c93f"/>
  <text x="600" y="27" text-anchor="middle" class="mono o" style="font-size:14px">islam@sahir: ~</text>

  <text x="48" y="92" class="mono p">$</text>
  <text x="70" y="92" class="mono c" clip-path="url(#t)">whoami --verbose</text>

  <g class="l" style="animation-delay:1.2s"><text x="48" y="134" class="mono"><tspan class="k">name    </tspan><tspan x="160" class="c">Islam Amr</tspan></text></g>
  <g class="l" style="animation-delay:1.7s"><text x="48" y="164" class="mono"><tspan class="k">role    </tspan><tspan x="160" class="c">AI Engineer · Local LLMs &amp; Agents</tspan></text></g>
  <g class="l" style="animation-delay:2.2s"><text x="48" y="194" class="mono"><tspan class="k">focus   </tspan><tspan x="160" class="c">LLM Security · Prompt Injection</tspan></text></g>
  <g class="l" style="animation-delay:2.7s"><text x="48" y="224" class="mono"><tspan class="k">creates </tspan><tspan x="160" class="c">AI-powered Motion Graphics</tspan></text></g>
  <g class="l" style="animation-delay:3.2s"><text x="48" y="254" class="mono"><tspan class="k">project </tspan><tspan x="160" class="m">SAHIR</tspan><tspan class="o"> — local Arabic voice assistant</tspan><tspan class="y"> ★ 42/42 evals</tspan></text></g>
  <g class="l" style="animation-delay:3.7s"><text x="48" y="284" class="mono p">$ <tspan class="cur">▍</tspan></text></g>
</svg>
